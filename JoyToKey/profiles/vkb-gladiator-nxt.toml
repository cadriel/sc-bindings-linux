# joytokey settings: which physical device is "Joystick 1", "Joystick 2", ... in a JoyToKey .cfg.
# Copy this file to ~/.config/joytokey/config.toml and edit it.
#   joytokey.py --list-devices      shows connected joysticks and their /dev/input/by-id names
#   joytokey.py --monitor           prints button and axis numbers as you press/move things
#
# Each entry is matched against:
#   - a glob on /dev/input/by-id   (e.g. "*Gladiator_NXT_L-event-joystick")
#   - "name:<text>"                 substring of the evdev device name
#   - an absolute path              (e.g. "/dev/input/event21")
joysticks = [
    "*Gladiator_NXT_L-event-joystick",   # Joystick 1
    "*Gladiator_NXT_R-event-joystick",   # Joystick 2
]

# Optional: JoyToKey .cfg to run when --config is not given.
# cfg = "/path/to/JoyToKey Dual VKB 4.10.cfg"
